
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#050607">
<title>Afnan X | Cyber Serpent</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  font-family:Arial,sans-serif;background:#050607;color:#eafff5;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit}
.screen{
  position:fixed;inset:0;display:none;overflow:hidden;
}
.screen.active{display:flex}
#intro{
  align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(ellipse at center,#10251d,#050607 65%);
}
.intro-content{padding:25px;width:100%;animation:introIn 1s ease both}
.kicker{
  color:#00ff9c;font:12px monospace;letter-spacing:4px;
  margin-bottom:25px;animation:flicker 2s infinite;
}
.name{
  font-size:clamp(24px,7vw,38px);font-weight:900;
  letter-spacing:1px;color:#eafff5;
  text-shadow:0 0 12px #00ff9c80;
  overflow-wrap:anywhere;
}
.nick{margin-top:18px;color:#00ff9c;font:15px monospace}
.scan{
  height:2px;width:min(260px,75%);margin:30px auto;
  background:#143329;overflow:hidden;
}
.scan:after{
  content:"";display:block;height:100%;width:35%;
  background:#00ff9c;box-shadow:0 0 14px #00ff9c;
  animation:scan 1.5s linear infinite;
}
@keyframes scan{from{transform:translateX(-110%)}to{transform:translateX(350%)}}
@keyframes flicker{0%,94%,100%{opacity:1}96%{opacity:.3}98%{opacity:.8}}
@keyframes introIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
#loading{
  align-items:center;justify-content:center;
  background:radial-gradient(ellipse,#10261f,#030506 68%);
}
.load-content{width:min(300px,80%);text-align:center}
.orb{
  width:110px;height:110px;border:1px solid #00ff9c;
  border-radius:50%;margin:0 auto 35px;position:relative;
  box-shadow:0 0 35px #00ff9c20,inset 0 0 22px #00ff9c16;
  animation:orbPulse 2s ease-in-out infinite;
}
.orb:before,.orb:after{
  content:"";position:absolute;inset:10px;border-radius:50%;
  border:2px solid transparent;border-top-color:#00ff9c;
  border-bottom-color:#00e5ff;animation:spin 1.4s linear infinite;
}
.orb:after{inset:23px;border-width:1px;animation:spin 2.1s linear infinite reverse}
.orb-core{
  position:absolute;inset:40px;background:#00ff9c;
  border-radius:50%;box-shadow:0 0 24px #00ff9c;
}
.load-title{font:bold 20px monospace;letter-spacing:3px;color:#eafff5}
.load-sub{font:10px monospace;color:#6fa995;letter-spacing:3px;margin:12px 0 25px}
.progress{height:3px;background:#153128;overflow:hidden}
.progress span{
  display:block;height:100%;width:0;background:#00ff9c;
  box-shadow:0 0 15px #00ff9c;animation:load 5s linear forwards;
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes orbPulse{50%{transform:scale(1.06);box-shadow:0 0 48px #00ff9c30}}
@keyframes load{to{width:100%}}
#menu{
  background:radial-gradient(ellipse at top,#10231b,#050607 65%);
  align-items:center;justify-content:center;padding:24px;
}
.menu-wrap{width:min(420px,100%)}
.menu-head{text-align:center;margin-bottom:35px}
.menu-head small{font:11px monospace;letter-spacing:3px;color:#00ff9c}
.menu-head h2{font-size:27px;margin:15px 0 0;letter-spacing:2px}
.option{
  width:100%;display:block;text-align:right;margin:15px 0;
  padding:19px 16px;border:1px solid #23533f;border-radius:8px;
  color:#dfffee;background:linear-gradient(100deg,#0a1611,#101b19);
  line-height:1.5;position:relative;overflow:hidden;
  opacity:0;animation:slideIn .65s ease forwards;
}
.option:nth-child(1){animation-delay:.1s}
.option:nth-child(2){animation-delay:.35s}
.option:nth-child(3){animation-delay:.6s}
.option:before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:#00ff9c;box-shadow:0 0 12px #00ff9c;
}
.option:active{background:#123324}
.option .num{color:#00ff9c;font:11px monospace;display:block;text-align:left;margin-bottom:6px}
@keyframes slideIn{from{opacity:0;transform:translateX(70px)}to{opacity:1;transform:translateX(0)}}
#congrats{
  align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(ellipse,#122b20,#020403 70%);
}
.congrats-text{
  font-size:clamp(34px,10vw,60px);font-weight:900;color:#00ff9c;
  text-shadow:0 0 10px #00ff9c,0 0 35px #00ff9c60;
  animation:celebrate .7s ease-in-out infinite alternate;
}
.congrats-sub{color:#b4e6d2;font:12px monospace;letter-spacing:4px;margin-top:18px}
@keyframes celebrate{from{transform:scale(.97)}to{transform:scale(1.04)}}
#particles{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#game{background:#fff;touch-action:none;cursor:crosshair}
#creatureCanvas{display:block;width:100%;height:100%;touch-action:none}
@media(prefers-reduced-motion:reduce){
  .intro-content,.kicker,.orb,.orb:before,.orb:after,.congrats-text{animation:none}
}
</style>
</head>
<body>

<section id="intro" class="screen active">
  <div class="intro-content">
    <div class="kicker">INITIALIZING SECURE INTERFACE</div>
    <div class="name">Developer<br>Mr.Rakibul Islam</div>
    <div class="nick">Nickname :- Afnan</div>
    <div class="scan"></div>
  </div>
</section>

<section id="loading" class="screen">
  <div class="load-content">
    <div class="orb"><div class="orb-core"></div></div>
    <div class="load-title">SYSTEM BOOT</div>
    <div class="load-sub">ESTABLISHING CONNECTION</div>
    <div class="progress"><span></span></div>
  </div>
</section>

<section id="menu" class="screen">
  <div class="menu-wrap">
    <div class="menu-head">
      <small>ACCESS TERMINAL // 03</small>
      <h2>SELECT YOUR PATH</h2>
    </div>
    <button class="option" data-choice="wife">
      <span class="num">OPTION_01</span>
      বউ এর নাম্বার দিয়ে লগ ইন করুন
    </button>
    <button class="option" data-choice="girlfriend">
      <span class="num">OPTION_02</span>
      গার্লফ্রেন্ড এর নাম্বার দিয়ে লগ ইন করুন
    </button>
    <button class="option" data-choice="none">
      <span class="num">OPTION_03</span>
      কোনো কিছু না থাকলে এখানে ট্যাপ করুন
    </button>
  </div>
</section>

<section id="congrats" class="screen">
  <canvas id="particles"></canvas>
  <div style="position:relative;z-index:1">
    <div class="congrats-text">Congratulations</div>
    <div class="congrats-sub">ACCESS GRANTED</div>
  </div>
</section>

<section id="game" class="screen active" style="display:none">
  <canvas id="creatureCanvas"></canvas>
</section>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);
const screens = ["intro","loading","menu","congrats","game"];
let sceneTimers = [];
let currentScene = "intro";

function later(fn, ms){
  const id = setTimeout(fn, ms);
  sceneTimers.push(id);
  return id;
}

function showScene(id){
  currentScene = id;
  screens.forEach(s => {
    const el = $(s);
    el.classList.toggle("active", s === id);
    el.style.display = s === id ? "flex" : "none";
  });
}

function startSequence(){
  showScene("intro");
  later(() => {
    showScene("loading");
    const bar = document.querySelector(".progress span");
    bar.style.animation = "none";
    void bar.offsetWidth;
    bar.style.animation = "load 5s linear forwards";
    later(() => showScene("menu"), 5000);
  }, 5000);
}

document.querySelectorAll(".option").forEach(btn => {
  btn.addEventListener("click", () => {
    // No phone number is requested or collected.
    showScene("congrats");
    startParticles();
    later(() => {
      stopParticles();
      showScene("game");
      initCreature();
    }, 5000);
  });
});

/* Celebration particles */
const pc = $("particles");
const pctx = pc.getContext("2d");
let particles = [], particleRAF = 0, particleRunning = false;

function startParticles(){
  pc.width = innerWidth * Math.min(devicePixelRatio || 1, 2);
  pc.height = innerHeight * Math.min(devicePixelRatio || 1, 2);
  pctx.setTransform(
    pc.width / innerWidth, 0, 0,
    pc.height / innerHeight, 0, 0
  );
  particles = Array.from({length:90}, () => ({
    x:innerWidth/2, y:innerHeight/2,
    vx:(Math.random()-.5)*8,
    vy:(Math.random()-.5)*8,
    life:35+Math.random()*65,
    size:1+Math.random()*3
  }));
  particleRunning = true;
  drawParticles();
}
function drawParticles(){
  if(!particleRunning)return;
  pctx.clearRect(0,0,innerWidth,innerHeight);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += .025; p.life--;
    pctx.globalAlpha = Math.min(1,p.life/30);
    pctx.fillStyle = Math.random()>.45 ? "#00ff9c" : "#00e5ff";
    pctx.fillRect(p.x,p.y,p.size,p.size);
    if(p.life<=0 || p.x<0 || p.x>innerWidth || p.y>innerHeight){
      p.x=innerWidth/2;p.y=innerHeight/2;
      p.vx=(Math.random()-.5)*8;p.vy=(Math.random()-.5)*8;
      p.life=45+Math.random()*55;
    }
  });
  pctx.globalAlpha=1;
  particleRAF=requestAnimationFrame(drawParticles);
}
function stopParticles(){
  particleRunning=false;
  cancelAnimationFrame(particleRAF);
  pctx.clearRect(0,0,pc.width,pc.height);
}

/* Main 2D skeletal centipede.
   Pure white screen. No text or controls. */
const canvas = $("creatureCanvas");
const ctx = canvas.getContext("2d");
let W=0,H=0,dpr=1;
let points=[], legs=[], running=false, raf=0;
let pointerDown=false, target=null, lastPointer=null;
const SEGMENT_GAP=8;
const BODY_LENGTH=39;
const LEG_COUNT=28;

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  canvas.width=Math.round(W*dpr);
  canvas.height=Math.round(H*dpr);
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);

  if(!points.length){
    const cx=W*.5, cy=H*.5;
    for(let i=0;i<BODY_LENGTH;i++)
      points.push({x:cx-i*SEGMENT_GAP,y:cy});
    legs=Array.from({length:LEG_COUNT},(_,i)=>({
      phase:i*.85,
      side:i%2===0?1:-1
    }));
  } else {
    points[0].x=Math.min(W-12,Math.max(12,points[0].x));
    points[0].y=Math.min(H-12,Math.max(12,points[0].y));
  }
}
window.addEventListener("resize",resize);

function initCreature(){
  resize();
  running=true;
  pointerDown=false;
  target=null;
  drawLoop();
}

function moveHead(){
  if(!pointerDown || !target)return;

  const head=points[0];
  const dx=target.x-head.x, dy=target.y-head.y;
  const dist=Math.hypot(dx,dy);
  if(dist<1.5)return;

  // Steady, moderate speed; never jumps directly to the finger.
  const speed=2.35;
  head.x += dx/dist*Math.min(speed,dist);
  head.y += dy/dist*Math.min(speed,dist);

  // Follow each preceding point like a snake.
  for(let i=1;i<points.length;i++){
    const prev=points[i-1], p=points[i];
    const vx=p.x-prev.x, vy=p.y-prev.y;
    const d=Math.hypot(vx,vy);
    if(d>SEGMENT_GAP){
      const excess=d-SEGMENT_GAP;
      p.x -= vx/d*excess;
      p.y -= vy/d*excess;
    }
  }
}

function getTangent(i){
  const a=points[Math.max(0,i-1)];
  const b=points[Math.min(points.length-1,i+1)];
  let dx=b.x-a.x,dy=b.y-a.y;
  const d=Math.hypot(dx,dy)||1;
  return {x:dx/d,y:dy/d};
}

function drawLegs(time){
  ctx.lineCap="round";
  ctx.lineJoin="round";

  for(let i=1;i<points.length-1;i++){
    const p=points[i], t=getTangent(i);
    const nx=-t.y, ny=t.x;
    const pair=legs[i%legs.length];
    const wave=Math.sin(time*.009+pair.phase);
    const bodyProgress=i/points.length;
    const len=8.2+Math.sin(bodyProgress*Math.PI)*2.0;
    const thickness=1.2;

    for(const side of [-1,1]){
      const swing=wave*2.8;
      const rootX=p.x+nx*side*1.7;
      const rootY=p.y+ny*side*1.7;
      const kneeX=p.x+nx*side*(len*.56)+t.x*swing;
      const kneeY=p.y+ny*side*(len*.56)+t.y*swing;
      const footX=p.x+nx*side*len+t.x*(wave*3.2);
      const footY=p.y+ny*side*len+t.y*(wave*3.2);

      ctx.strokeStyle="#111";
      ctx.lineWidth=thickness;
      ctx.beginPath();
      ctx.moveTo(rootX,rootY);
      ctx.lineTo(kneeX,kneeY);
      ctx.lineTo(footX,footY);
      ctx.stroke();

      // Small joints give a skeletal appearance.
      ctx.fillStyle="#111";
      ctx.beginPath();
      ctx.arc(kneeX,kneeY,1.15,0,Math.PI*2);
      ctx.fill();
    }
  }
}

function drawBody(){
  // A thin articulated central spine.
  for(let i=points.length-1;i>=0;i--){
    const p=points[i];
    const u=i/(points.length-1);
    const r= i===0 ? 3.3 : 1.65 + Math.sin(u*Math.PI)*.45;

    if(i<points.length-1){
      const next=points[i+1];
      ctx.strokeStyle="#111";
      ctx.lineWidth=2.0;
      ctx.beginPath();
      ctx.moveTo(p.x,p.y);
      ctx.lineTo(next.x,next.y);
      ctx.stroke();
    }

    ctx.fillStyle="#111";
    ctx.beginPath();
    ctx.arc(p.x,p.y,r,0,Math.PI*2);
    ctx.fill();

    // Small rib-like bone marks along the body.
    if(i>1 && i<points.length-2 && i%2===0){
      const t=getTangent(i);
      const nx=-t.y,ny=t.x;
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(p.x+nx*2,p.y+ny*2);
      ctx.lineTo(p.x-nx*2,p.y-ny*2);
      ctx.stroke();
    }
  }

  // A slightly elongated skull-like head.
  const h=points[0], t=getTangent(0);
  ctx.save();
  ctx.translate(h.x,h.y);
  ctx.rotate(Math.atan2(t.y,t.x));
  ctx.fillStyle="#111";
  ctx.beginPath();
  ctx.ellipse(0,0,5.0,3.0,0,0,Math.PI*2);
  ctx.fill();
  // Tiny paired eye sockets.
  ctx.fillStyle="#fff";
  ctx.beginPath();
  ctx.arc(1.8,-1.1,.65,0,Math.PI*2);
  ctx.arc(1.8,1.1,.65,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawLoop(time=0){
  if(!running)return;
  ctx.fillStyle="#fff";
  ctx.fillRect(0,0,W,H);

  if(pointerDown){
    moveHead();
  }

  drawLegs(time);
  drawBody();

  raf=requestAnimationFrame(drawLoop);
}

function pointerPos(e){
  const rect=canvas.getBoundingClientRect();
  return {x:e.clientX-rect.left,y:e.clientY-rect.top};
}

canvas.addEventListener("pointerdown",e=>{
  pointerDown=true;
  target=pointerPos(e);
  lastPointer=target;
  try{canvas.setPointerCapture(e.pointerId)}catch(_){}
  e.preventDefault();
});
canvas.addEventListener("pointermove",e=>{
  if(!pointerDown)return;
  target=pointerPos(e);
  lastPointer=target;
  e.preventDefault();
});
function releasePointer(){
  pointerDown=false;
  target=null;
}
canvas.addEventListener("pointerup",releasePointer);
canvas.addEventListener("pointercancel",releasePointer);
canvas.addEventListener("lostpointercapture",releasePointer);

startSequence();
})();
</script>
</body>
  </html>
